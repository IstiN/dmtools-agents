# crap4dart configuration for the dmtools-agents instruction corpus (gh-1147).
# Only the file-level `similarity` gate is used here (invoked via
# `crap4dart check --only similarity --baseline`). It scans markdown and
# JavaScript sources (gh-1251); `js/unit-tests/**` is excluded because the
# unit-test tree legitimately repeats fixture/boilerplate shapes.
# `snapshots/**` and `docs/agents/generated/**` are generated aggregations
# verified by `node generate_agent_snapshots.js` and `node js/agentDocGenerator.js`
# in `.github/workflows/agent-docs.yml`, so they are excluded from similarity.
sources: [.crap4dart]

coverage:
  run_tests: false
  required: false

gates:
  similarity:
    enabled: true
    severity: error
    dirs: ['.']
    include: ['**/*.md', '**/*.js']
    min_shingles: 50
    jaccard: 0.5
    containment: 0.85
    exclude:
      - '.git/**'
      - '.dart_tool/**'
      - 'node_modules/**'
      - 'snapshots/**'
      - 'docs/agents/generated/**'
      - 'js/unit-tests/**'
      # The generalist's single-file aggregations embed the shared sources
      # (general_guidelines.md + few_shots.md) BY DESIGN — the generalist
      # session reads one self-contained file. Their similarity to the
      # sources is the design, not a duplication bug (the metric re-breaks
      # on every edit of either file; the baseline ratchet is the wrong
      # tool for a designed pair — the gh-1147 snapshots exclusion is the
      # same class).
      - 'instructions/pr_review/generalist/lens.md'
      - 'instructions/pr_review/generalist/few_shots.md'
