<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Board</title>
  <!--
    Factory Board v3 (owner 2026-10-03) — deploy anywhere (GitHub Pages,
    Cloudflare Pages, fa1.dev). Zero build, zero tokens: the board reads
    factory-state snapshots published by each factory's SM tick to its
    repo's `factory-data` branch (raw.githubusercontent CDN links).
    Schema 1, schema 2 and the v3 additions (card history, backlog,
    optional tokens) all render — additive schema, old snapshots never
    break it.

    v3 surfaces: readable per-lane summaries + progress bars, a click-to-
    open details drawer (state history, per-state timings, per-leg token
    table), and the issue backlog lanes fed by the same snapshots.

    DEPLOY:
      1. Copy this folder.
      2. Edit config.js — factories[] + lanes + backlogColumns (all knobs
         live there).
      3. Style: edit styles.css :root variables (or data-theme overrides).

    DEV: append ?fixture=visual-check/fixture.json to render a bundled
    sample snapshot (deterministic visual-check screenshots, no network);
    ?drawer=pr-817 deep-links the details drawer.
  -->
  <script>
    (function () {
      try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('fb-theme') ||
              (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" id="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M3 21h18"></path>
          <path d="M4 21V10l5 3V10l5 3V7l6-3v17"></path>
          <path d="M17.5 7.5v0"></path>
          <circle cx="8" cy="16.5" r=".75" fill="currentColor" stroke="none"></circle>
          <circle cx="13" cy="13.5" r=".75" fill="currentColor" stroke="none"></circle>
          <circle cx="18" cy="10.5" r=".75" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <h1 id="brand-title">Factory Board</h1>
      <span class="live" id="live-dot" title="auto-refresh"></span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">—</span>
      <button class="theme-btn" id="theme-btn" title="toggle theme" aria-label="toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path>
        </svg>
      </button>
    </div>
  </header>

  <nav class="factory-tabs" id="factory-tabs" aria-label="factories"></nav>

  <main id="board">
    <section class="statusline" id="statusline" hidden>
      <span class="pill" id="tick-pill">tick: —</span>
      <span class="pill" id="counts-pill"></span>
      <span class="pill" id="backlog-pill"></span>
      <span class="pill" id="repo-pill"></span>
      <span class="pill" id="schema-pill">schema 2</span>
    </section>
    <div class="lanes" id="lanes"></div>
    <section class="backlog" id="backlog" aria-label="issue backlog"></section>
    <p class="error" id="error" hidden></p>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="details drawer"
         role="dialog" aria-modal="false"></aside>

  <footer class="foot">
    <span id="foot-note">states are what the machine decided — snapshot from the SM tick · timestamps accumulate tick-over-tick</span>
  </footer>

  <script src="config.js"></script>
  <script src="steps.js"></script>
  <script src="app.js"></script>
</body>
</html>
