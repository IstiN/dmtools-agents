# Publishes the archify machine-loop diagram (site/) to GitHub Pages.
# Repo Settings → Pages → Source = "GitHub Actions" (set 2026-09-21):
# nothing deploys until a workflow calls deploy-pages — this is it.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # site/ also carries visual-check sidecars (dev artifacts) — drop them.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a site/ _site/ --exclude 'index.visual-check*'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
