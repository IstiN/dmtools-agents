# Agent pack release (dmtools-agents#441).
#
# Builds and publishes per-agent versioned packs — one self-contained zip per
# affected agent (<agent>-<version>.zip + manifest.json + .sha256) — so
# consumers fetch a single agent over plain HTTPS instead of a git submodule.
#
# The pack format is built by `dmtools compile` (dm.ai#595) — the runtime repo
# owns the single implementation; this workflow only orchestrates: test →
# compute affected set → bump versions.json → compile → validate → publish.
#
# Triggers:
#   push to main            — affected set from the diff since the last release tag
#   workflow_dispatch       — manual; `agents=all` or `agents=name1,name2`,
#                             `bump` selects patch/minor/major (default patch)
name: Agent Pack Release

on:
  push:
    branches: [main]
    paths-ignore:
      # CI-only changes never cut a release. NOTE: '**.md' is deliberately
      # NOT ignored — agent instruction packs ship .md files (instructions/
      # joined the default agents in a57b3ba); ignoring them let runner
      # configs reference pack files the published zips never carried
      # (live: 2026-10-01 dev-leg failure, story_development-0.1.11).
      - '.github/**'
      - 'docs/**'
      - 'site/**'
  workflow_run:
    # gh-867: the merge bot's GITHUB_TOKEN merge push never fires the push
    # trigger above (GitHub suppresses workflow triggers on GITHUB_TOKEN
    # events — #863/#866 reached main with no release until an operator
    # dispatched one). The bot's own run completion IS a normal event, so
    # a successful 'Machine Merge Bot' run now cuts a release within
    # seconds (the suspenders; the gh-844 kicker stays the 10-min belt).
    #
    # NO branches: filter — the bot runs on PR-branch events, so its
    # workflow_run head_branch is the PR branch, never main; a
    # branches: [main] filter would silence this trigger entirely. "Main
    # filtering" is the tag...main diff + dist/.no-release no-op (gh-690
    # dedup), and the job gate below drops failed bot runs.
    workflows: ['Machine Merge Bot']
    types: [completed]
  workflow_dispatch:
    inputs:
      agents:
        description: "'all' or a comma-separated agent list (default: affected set)"
        required: false
        default: ''
      bump:
        description: 'Version bump'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: 'Build + validate without publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: agent-pack-release
  cancel-in-progress: false

permissions:
  contents: write # publish the GitHub Release (ledger push rides the app token)

jobs:
  release:
    # gh-867: workflow_run fires on EVERY bot completion (label latch
    # ticks merge nothing; 'completed' also covers failures) — only a
    # successful bot run may reach the build. A successful run whose
    # merge changed nothing release-relevant then no-ops via
    # dist/.no-release (the same gh-690 dedup that absorbs the kicker's
    # double dispatch).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # The JS unit-test suite is NOT re-run here (owner 2026-10-01): quality.yml
    # runs it on every PR and main's protection is strict (required `crap` +
    # up-to-date), so every commit reaching main already passed the suite on a
    # current head. The release only computes the affected set, compiles,
    # validates and publishes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the since-last-release diff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve dmtools CLI version (latest -> current tag)
        # 'latest' resolves to the current release tag (owner mandate 2026-10-01).
        env:
          GH_TOKEN: ${{ github.token }}
          DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION || 'v0.1.22' }}
        run: |
          if [ "${DMTOOLS_VERSION}" = "latest" ]; then
            TAG="$(gh release view --repo epam/dmtools-dart --json tagName --jq .tagName)"
            echo "DMTOOLS_VERSION=${TAG}" >> "$GITHUB_ENV"
            echo "::notice::dmtools CLI: latest resolved to ${TAG}"
          fi

      - name: Install dmtools CLI (pinned release bundle)
        env:
          DMTOOLS_VERSION: ${{ env.DMTOOLS_VERSION || vars.DMTOOLS_VERSION || 'v0.1.22' }}
        run: |
          curl -fsSL "https://github.com/epam/dmtools-dart/releases/download/${DMTOOLS_VERSION}/install.sh" \
            -o /tmp/dmtools-install.sh
          bash /tmp/dmtools-install.sh "${DMTOOLS_VERSION}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Compute base ref (last release tag, if any)
        id: base
        run: |
          last_tag=$(git tag --list 'agents-rel-*' --sort=-creatordate | head -1)
          echo "ref=${last_tag}" >> "$GITHUB_OUTPUT"
          echo "base ref: ${last_tag:-<none — first release, all agents>}"

      - name: Sync to current main (queued runs release current main)
        # The concurrency group serializes release runs, but actions/checkout
        # gives each run its own TRIGGER SHA — a run queued behind another
        # computed its affected set and version bumps from a ledger that
        # pre-dated the previous run's ledger PR (live 2026-10-04, gh-690:
        # three content PRs merged within 3 min → overlapping releases
        # double-bumped sm_github/pr_review to 0.1.24 and cut the empty
        # ledger PR #689). Reset to origin/main so base-tag...HEAD covers
        # exactly the unreleased content ONCE, from the current ledger; a
        # queued run that finds everything already released writes
        # dist/.no-release and no-ops. Gated to push + workflow_run
        # events — a workflow_run-triggered checkout resolves to the
        # event-time main (gh-867: the merge may land after the bot-run
        # event fired), and queued runs must release current main; a
        # manual dispatch may deliberately target a non-main ref.
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build + validate affected agent packs
        id: build
        env:
          AGENTS: ${{ inputs.agents || '' }}
          BUMP: ${{ inputs.bump || 'patch' }}
          DRY: ${{ inputs.dry_run || false }}
          # gh-812: the builder reads the previous release's shipped catalog
          # and same-version pack zips (version uniqueness + payload compare).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh-812 rework (review thread 3): untrusted tag names reach the
          # script ONLY through env indirection — never template-expanded
          # into the run: block. Actions interpolates ${{ }} BEFORE bash
          # parses the script, so a crafted agents-rel-* tag name (any user
          # with push access can create one; the newest by creatordate wins)
          # could break out of the quoting and run arbitrary code in this
          # contents:write job.
          BASE_REF: ${{ steps.base.outputs.ref }}
          PREV_RELEASE_TAG: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          # gh-812 rework: release-base tags are machine-generated
          # (agents-rel-YYYYMMDD-HHMMSS); anything else in the newest
          # agents-rel-* tag is rejected before it reaches the builder.
          # Empty is allowed — the first release has no base tag.
          for tag in "${BASE_REF}" "${PREV_RELEASE_TAG}"; do
            if [ -n "${tag}" ] && ! [[ "${tag}" =~ ^agents-rel-[0-9]{8}-[0-9]{6}$ ]]; then
              echo "::error::unexpected agents-rel tag format: ${tag}" >&2
              exit 1
            fi
          done
          args=(--out dist)
          [ -n "${AGENTS}" ] && args+=(--agents="${AGENTS}")
          [ -n "${BASE_REF}" ] && args+=(--base-ref="${BASE_REF}")
          # gh-812: base versions come from what the last release SHIPPED —
          # versions.json on main is a best-effort ledger that can (and did)
          # lag reality by whole releases, re-shipping a live version with
          # new content.
          [ -n "${PREV_RELEASE_TAG}" ] && args+=(--prev-release-tag="${PREV_RELEASE_TAG}")
          [ "${DRY}" = "true" ] && args+=(--dry-run)
          [ "${BUMP}" != "patch" ] && args+=(--bump="${BUMP}")
          node ci/release_packs.mjs "${args[@]}"
          # Signal "nothing to release" to the publish steps.
          if [ -f dist/.no-release ]; then echo "released=false" >> "$GITHUB_OUTPUT"; else echo "released=true" >> "$GITHUB_OUTPUT"; fi

      - name: Mint dmtools-factory-bot token (ledger push identity)
        # main accepts updates ONLY from dmtools-factory-bot (ruleset
        # main-merge-only-sm). The same app is the ONLY bypass actor of
        # main-protection, so it may push the version ledger straight to main
        # (no PR); every other change still reaches main via the SM merge bot
        # after the required checks.
        id: app-token
        if: steps.build.outputs.released == 'true' && inputs.dry_run != true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: "Bump versions.json via direct push to main (bot bypass)"
        # The version ledger is pushed directly to main by dmtools-factory-bot
        # (bypass actor on main-protection + main-merge-only-sm). [skip ci] in
        # the subject keeps the push from re-triggering a release.
        #
        # Nothing-changed guard (gh-690): skip when main already carries the
        # target versions — checked before the first push (guard 1) and again
        # after every fetch/rebase in the retry loop (guard 2). A rejected
        # (non-fast-forward) push is retried up to 3 times on fresh main;
        # never fail the release AFTER publishing.
        if: steps.build.outputs.released == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "dmtools-factory-bot[bot]"
          git config user.email "dmtools-factory-bot[bot]@users.noreply.github.com"
          # actions/checkout persists GITHUB_TOKEN as an http extraheader that
          # OVERRIDES the URL credentials — the push would then run as
          # github-actions[bot] (no bypass) and be declined. Drop it so the
          # push authenticates as dmtools-factory-bot.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cleanup() { git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"; }
          trap cleanup EXIT
          git add versions.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): bump agent versions [skip ci]"
          # Guard 1
          git fetch origin main
          if git diff --quiet HEAD origin/main -- versions.json; then
            echo "::notice::main already carries the target agent versions — nothing to push"
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            # Guard 2 — main may have received the same ledger meanwhile.
            if git diff --quiet HEAD origin/main -- versions.json; then
              echo "::notice::main already carries the target agent versions — nothing to push"
              exit 0
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "versions.json pushed to main ($(git rev-parse HEAD))"
              exit 0
            fi
            echo "::warning::push to main rejected (attempt ${attempt}/3) — rebasing on fresh main"
            sleep $((attempt * 5))
          done
          echo "::warning::could not push versions.json to main after 3 attempts — the next release recomputes from main"

      - name: Publish the GitHub Release
        if: steps.build.outputs.released == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="agents-rel-$(date -u +%Y%m%d-%H%M%S)"
          notes="Per-agent packs built by \`dmtools compile\` (dm.ai#595). See catalog.json for agent → version."
          # Upload zips + sidecar checksums + catalog.json as release assets.
          gh release create "$tag" dist/*.zip dist/*.zip.sha256 dist/catalog.json \
            --title "Agent packs $tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          echo "Published $tag"
